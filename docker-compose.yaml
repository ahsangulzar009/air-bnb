
x-db-url: &db-url
  DATABASE_URL: postgresql://air-bnb:airbnb1122@postgis:5432/air-bnb

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: airbnb_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: air-bnb
      POSTGRES_PASSWORD: airbnb1122
      POSTGRES_DB: air-bnb
    ports:
      - "5432:5432"
    volumes:
      - ./airbnbPgdata:/var/lib/postgresql/data
    networks:
      - airbnb-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airbnb_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      <<: *db-url
    networks:
      - airbnb-network

networks:
  airbnb-network:
    driver: bridge

volumes:
  airbnb_pgdata: